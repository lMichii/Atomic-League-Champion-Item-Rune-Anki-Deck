<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>League card review</title><style>
body{margin:0;background:#101317;color:#e8e8e8;font:15px/1.5 Arial}header{padding:18px;border-bottom:1px solid #41444a}main{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px}button,select,input,textarea{font:inherit;background:#20262d;color:#eee;border:1px solid #626b75;padding:8px;border-radius:2px}button{cursor:pointer}button:disabled{opacity:.4}button.primary{background:#31546b;border-color:#6291ad;font-weight:bold;padding:11px 16px}textarea{display:block;width:95%;min-height:90px;margin:8px 0}label{display:block;margin:9px 0}input[type=text]{width:90%}iframe{width:100%;height:700px;border:1px solid #41444a}details{margin:10px 0;border-top:1px solid #343a40;padding:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.warn{color:#e5bf7f}.ok{color:#81d8a1}#message{white-space:pre-wrap;color:#e5bf7f;padding:12px}#message.requirement{border-left:3px solid #e5bf7f;background:#25211b;margin:8px 0}.invalid input,.invalid textarea{border-color:#e5bf7f;outline:1px solid #e5bf7f}a{color:#94c9ff}.review-section{margin:18px 0}.claim{padding:8px 0;border-bottom:1px solid #292f35}.claim h4{margin:3px 0 7px;font-size:15px}.source-row{padding:7px 0 7px 12px;border-left:2px solid #3e596b;margin:6px 0}.source-row blockquote{margin:4px 0;color:#d6dbe0}.source-meta{color:#aab3bc;font-size:13px}.claim-controls{display:inline-flex;align-items:center;gap:6px}.claim-controls input{margin:0}.section-title{margin:18px 0 6px;font-size:18px}@media(max-width:900px){main{display:block}aside{max-height:300px;overflow:auto}}
</style><header><h1>League card review</h1><div id="summary"></div><p>Learning text, evidence and media have separate review decisions. Creating a proposal does not apply approval or build a deck.</p></header>
<div id="message" role="status"></div><main><aside><label>Champion <select id="champion"></select></label><div id="list"></div><button id="propose">Create proposal for ready cards</button></aside><section id="detail"></section></main>
<script>
const token='__NONCE__';let state,selected;const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(preserveDetail=false){const r=await fetch('/api/state');state=await r.json();if(state.error)throw Error(state.error);const names=Object.keys(state.champions);let currentChampion=$('champion').value;$('champion').innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join('');if(names.includes(currentChampion))$('champion').value=currentChampion;$('summary').textContent=names.map(n=>`${n}: ${state.champions[n].ready}/${state.champions[n].cards} ready`).join(' · ');renderList();if(selected){if(preserveDetail){const c=current();$('reviewStatus').textContent=`Content: ${c.content_review.status} · Media: ${c.media_review.status}`;$('reviewBlockers').textContent=c.blockers.join(' · ')||'Both reviews are complete'}else show(selected)}}
function renderList(){let cards=state.cards.filter(c=>c.champion===$('champion').value);$('list').innerHTML=cards.map(c=>`<p><button data-id="${esc(c.id)}">${esc(c.working.row.slot)} · ${esc(c.working.row.ability)}</button><br><small class="${c.blockers.length?'warn':'ok'}">${esc(c.blockers.join('; ')||'Ready for change review')}</small></p>`).join('');$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id));$('propose').disabled=!cards.some(c=>!c.blockers.length)}
function current(){return state.cards.find(c=>c.id===selected)}
function check(id,text){return `<label><input type="checkbox" id="${id}"> ${text}</label>`}
function needsMediaReason(media){return Boolean(media.selected_override||Object.keys(media.overrides_by_role||{}).length||(media.provenance||[]).some(p=>!p.source||!p.license_reference||p.distribution_status==='restricted'))}
const savedFieldIds=['notes','question','answer','counterplay','build_focus','priority','fallbackReason','source','rights','license','version','display','mediaRole','override'];
const savedCheckIds=['claims','cores','inference','warnings','combinedConfirm','mediaConfirm','matching','rightsAck','fallback','variant'];
function cardFormKey(id){return 'league-review-form:'+id}
function readCardForm(id){try{return JSON.parse(sessionStorage.getItem(cardFormKey(id))||'{}')}catch{return {}}}
function saveCardForm(id){if(!id||!$('detail')?.querySelector('#reviewer'))return;const form={fields:{},checks:{},source_ids:[...document.querySelectorAll('[data-source]:checked')].map(e=>e.dataset.source)};for(const key of savedFieldIds)if($(key))form.fields[key]=$(key).value;for(const key of savedCheckIds)if($(key))form.checks[key]=$(key).checked;sessionStorage.setItem(cardFormKey(id),JSON.stringify(form))}
function sourceTitle(c,id,e){return c.source_labels?.[id]||(id.startsWith('wiki:')?`Wiki: ${e.locator||id}`:id.startsWith('riot:')?`Riot: ${e.locator||id}`:e.locator||id)}
function evidenceRef(c,ref,selectedSources){const e=c.evidence.find(x=>x.id===ref.source_id);if(!e)return `<div class="source-row warn">Evidence mapping unavailable · ${esc(ref.source_id||'source not recorded')}</div>`;const type=e.provider?.includes('wiki')?'Wiki':e.provider?.includes('riot')?'Riot':'Source';return `<div class="source-row"><div class="source-meta"><span class="claim-controls"><input type="checkbox" data-source="${esc(e.id)}" ${selectedSources.includes(e.id)?'checked':''} aria-label="Select ${esc(sourceTitle(c,e.id,e))}"><strong>${esc(sourceTitle(c,e.id,e))}</strong></span> · ${esc(type)} · <a href="${esc(e.url)}" target="_blank" rel="noopener">Open source</a></div><blockquote>${esc(ref.quote||'Citation excerpt unavailable')}</blockquote><details><summary>Retrieved source text</summary><pre>${esc(e.text||'Source text unavailable')}</pre></details></div>`}
function mapping(c,title,summary,citations,selectedSources){if(!Array.isArray(citations)||!citations.length)return `<div class="claim"><h4>${esc(title||'Claim')}</h4><div class="warn">Evidence mapping unavailable</div></div>`;return `<div class="claim"><h4>${esc(title||'Claim')}</h4>${summary?`<p>${esc(summary)}</p>`:''}${citations.map(ref=>evidenceRef(c,ref,selectedSources)).join('')}</div>`}
function show(id){if(selected)saveCardForm(selected);selected=id;const c=current(),row=c.working.row,saved=readCardForm(id);const name=c.working.learning_unit?c.id.toLowerCase().replace(/[^a-z0-9-]+/g,'-')+'.html':(row.slot==='-'?'overview':row.slot.toLowerCase())+'.html';const claims=c.working.evidence?.claims||[];const defaultSources=c.content_review.citations?.map(x=>x.source_id)||[];const selectedSources=Array.isArray(saved.source_ids)?saved.source_ids:defaultSources;const claimSourceIds=new Set(claims.flatMap(f=>(f.citations||[]).map(q=>q.source_id)));const coreSourceIds=new Set((c.core_mechanics||[]).flatMap(f=>(f.citations||[]).map(q=>q.source_id)));const usedSourceIds=new Set([...claimSourceIds,...coreSourceIds]);const relevantConflicts=[],otherConflicts=[];for(const conflict of c.source_conflicts||[]){((conflict.source_ids||[]).some(x=>usedSourceIds.has(x))?relevantConflicts:otherConflicts).push(conflict)}
const manualMedia=Boolean(c.media.selected_override||Object.keys(c.media.overrides_by_role||{}).length);const variantMedia=c.working.learning_unit?.kind==='ability_variant';const sourceConcern=(c.media.provenance||[]).some(p=>!p.source||!p.license_reference||p.distribution_status==='restricted');const distributionPending=(c.media.provenance||[]).some(p=>p.distribution_status&&p.distribution_status!=='cleared');
const evidenceHtml=(c.core_mechanics||[]).map(core=>mapping(c,core.summary,'Required core mechanic',core.citations,selectedSources)).join('')+claims.map(claim=>mapping(c,claim.claim,'Claim in card evidence',claim.citations,selectedSources)).join('');
const conflictHtml=conflict=>{const ids=conflict.source_ids||[];const sides=ids.map(sourceId=>{const e=c.evidence.find(x=>x.id===sourceId);return e?`<p><strong>${esc(sourceTitle(c,sourceId,e))}:</strong> ${esc(e.text)}</p>`:''}).join('');return `<div class="claim"><h4>${esc(conflict.topic||'Source conflict')}</h4>${sides}<p><strong>Generator resolution:</strong> ${esc(conflict.resolution||'Not recorded')}</p><p class="warn"><strong>Manual review required:</strong> ${c.content_review.status!=='approved'?'Yes · content approval is '+esc(c.content_review.status):'Review status is recorded as approved; recheck this conflict if the text changes.'}</p></div>`};
$('detail').innerHTML=`<h2>${esc(row.champion)} · ${esc(row.ability)}</h2><p><code>${esc(c.id)}</code></p><p class="warn">${esc(c.blockers.join(' · '))}</p><h3 class="section-title">Card preview</h3><iframe title="Card front and back" src="/preview/${c.champion.toLowerCase()}/previews/${name}"></iframe>
<section class="review-section"><h3 class="section-title">Important claims and supporting sources</h3><p class="source-meta">Check each quoted excerpt against the card answer. Source selection is used by the existing approval check.</p>${evidenceHtml||'<p class="warn">Evidence mapping unavailable</p>'}<details><summary>All retrieved source excerpts</summary>${c.evidence.map(e=>`<div class="claim"><h4>${esc(sourceTitle(c,e.id,e))} · ${esc(e.provider?.includes('wiki')?'Wiki':e.provider?.includes('riot')?'Riot':'Source')}</h4><p class="source-meta">${esc(e.locator||'Source locator unavailable')} · <a href="${esc(e.url)}" target="_blank" rel="noopener">Open source</a></p><details><summary>Retrieved source text</summary><pre>${esc(e.text)}</pre></details></div>`).join('')}</details></section>
<section class="review-section"><h3 class="section-title">Relevant conflicts and factual risks</h3>${relevantConflicts.length?relevantConflicts.map(conflictHtml).join(''):'<p>No source conflicts are mapped to the selected card claims.</p>'}${c.warnings?.issues?.length?`<h4>Card factual risks</h4><ul>${c.warnings.issues.map(issue=>`<li>${esc(issue)}</li>`).join('')}</ul>`:''}${c.warnings?.manual_visual_review_required?'<p class="warn">Manual visual review is still required for this card.</p>':''}<details><summary>Other champion conflicts (${otherConflicts.length})</summary>${otherConflicts.length?otherConflicts.map(conflictHtml).join(''):'<p>No unrelated conflicts.</p>'}</details></section>
<section class="review-section approval-panel"><h3 class="section-title">Approve this card</h3><p id="reviewStatus">Content: <strong>${esc(c.content_review.status)}</strong> · Media: <strong>${esc(c.media_review.status)}</strong></p><p id="reviewBlockers" class="warn">${esc(c.blockers.join(' · ')||'Both reviews are complete')}</p><label>Reviewer <input id="reviewer" type="text" placeholder="Your name" required></label><label>Review notes / reason<textarea id="notes" placeholder="Optional review notes"></textarea></label>${check('combinedConfirm','I checked every claim against its cited evidence, reviewed required cores and warnings, and inspected the selected media for the exact ability or variant and its source information.')}<button id="combinedApprove" class="primary">Approve Content &amp; Media</button><button id="nextPending" hidden>Next pending card</button><details><summary>Separate approval actions</summary><p>Use these when content and media need separate decisions.</p>${check('claims','I checked every mechanical claim against the selected evidence.')}${check('cores','I checked coverage of the important core mechanics.')}${check('inference','I understand Counterplay and broad build focus are inferred guidance.')}${check('warnings','I reviewed and acknowledge the listed source/patch/editorial warnings.')}<button id="contentApprove">Approve content only</button> <button id="contentReject">Reject content</button></details></section>
<details><summary>Edit learning text</summary><label>Question<textarea id="question">${esc(row.question)}</textarea></label><label>Explanation<textarea id="answer">${esc(row.answer)}</textarea></label><label>Counterplay<textarea id="counterplay">${esc(row.counterplay)}</textarea></label><label>Build focus (overview only)<input id="build_focus" type="text" value="${esc(row.build_focus)}"></label><label>Priority <select id="priority">${['A','B','C'].map(p=>`<option ${row.priority===p?'selected':''}>${p}</option>`).join('')}</select></label><button id="save">Save text; require content re-review</button></details>
<details><summary>Replace media with a local file</summary><p>Use an ability-length GIF, PNG screenshot/icon, MP4 or WebM. Video converts to the existing GIF format. A known generic slot clip is rejected for a weapon variant.</p><input id="file" type="file" accept=".gif,.png,.mp4,.webm"><label>Original source / recording description<input id="source" type="text"></label><label>Rights holder / recorder<input id="rights" type="text"></label><label>License reference or permission notes<input id="license" type="text"></label><label>Asset / recording version (or unknown)<input id="version" type="text" value="unknown"></label><label>Display <select id="display"><option value="animation">Animation</option><option value="screenshot">Screenshot</option><option value="icon">Icon</option><option value="supplemental">Supplementary passive cue</option></select></label>${check('variant','Apply to this exact ability-variant identity (when applicable).')}<button id="upload">Import replacement for review</button><hr><label>Replacement <select id="override">${c.overrides.map(o=>`<option value="${o.id}">${esc(o.review.status)} · ${esc(o.provenance.source)}</option>`).join('')}</select></label><button id="overrideApprove" ${c.overrides.length?'':'disabled'}>Approve this replacement’s ability matching</button></details>
<details id="mediaReviewDetails"><summary>Media review and advanced QA</summary>${check('mediaConfirm','I inspected the selected media, confirmed the correct ability, and reviewed its source information.')}${variantMedia?'<p class="source-meta">Variant media is bound to this ability/weapon context. Verify the exact variant in the preview.</p>':''}${manualMedia?'<p class="warn">A manual media replacement is selected. Confirm the exact ability matching.</p>':''}${sourceConcern?'<p class="warn">Source or licensing information needs additional review.</p>':''}${distributionPending?'<p class="source-meta">Distribution clearance: pending. This review does not clear distribution rights.</p>':''}${c.media.fallback?`${check('fallback','Accept the matched static image fallback for this card.') }<label>Static-fallback notes (optional)<input id="fallbackReason" type="text"></label>`:''}<button id="mediaApprove">Approve media only</button> <button id="mediaReject">Reject media</button><details><summary>Full technical QA data</summary><pre>${esc(JSON.stringify({warnings:c.warnings,risks:c.factual_risks,conflicts:c.source_conflicts,media:c.media},null,2))}</pre>${c.incoming_generated_revision?'<p class="warn">A newer generated revision is available. Your working text and reviews were preserved.</p>':''}</details></details>`;
$('nextPending').hidden=true;const roleControl=document.createElement('label');roleControl.innerHTML='Media role <select id="mediaRole"><option value="front">Front image / animation</option><option value="icon">Answer icon (PNG)</option><option value="cue">Supplementary passive cue</option></select>';$('file').after(roleControl);$('mediaRole').onchange=()=>{if($('mediaRole').value==='icon')$('display').value='icon';if($('mediaRole').value==='cue')$('display').value='supplemental'};$('variant').disabled=!c.working.learning_unit?.context_id;
$('reviewer').value=sessionStorage.getItem('league-reviewer')||'';$('reviewer').oninput=()=>sessionStorage.setItem('league-reviewer',$('reviewer').value);
if(saved.fields)for(const [key,value] of Object.entries(saved.fields))if($(key))$(key).value=value;
if(saved.checks)for(const [key,value] of Object.entries(saved.checks))if($(key))$(key).checked=Boolean(value);
if(Array.isArray(saved.source_ids))$('detail').querySelectorAll('[data-source]').forEach(box=>box.checked=saved.source_ids.includes(box.dataset.source));
$('detail').querySelectorAll('[data-source]').forEach(box=>box.onchange=()=>{$('detail').querySelectorAll(`[data-source="${CSS.escape(box.dataset.source)}"]`).forEach(same=>same.checked=box.checked)});
$('detail').querySelectorAll('input:not([type=file]),textarea,select').forEach(field=>{field.addEventListener('input',()=>saveCardForm(id));field.addEventListener('change',()=>saveCardForm(id))});
$('save').onclick=()=>act('edit',{fields:Object.fromEntries(['question','answer','counterplay','build_focus','priority'].map(k=>[k,$(k).value]))});
$('combinedApprove').onclick=()=>combinedDecision();
$('contentApprove').onclick=()=>decision('content',{status:'approved',claims_checked:$('claims').checked,cores_checked:$('cores').checked,inferences_acknowledged:$('inference').checked,warnings_acknowledged:$('warnings').checked,source_ids:[...document.querySelectorAll('[data-source]:checked')].map(e=>e.dataset.source)});
$('contentReject').onclick=()=>decision('content',{status:'rejected',source_ids:[...document.querySelectorAll('[data-source]:checked')].map(e=>e.dataset.source)});$('mediaReject').onclick=()=>decision('media',{status:'rejected'});
$('mediaApprove').onclick=()=>decision('media',{status:'approved',matching_checked:$('mediaConfirm').checked,rights_acknowledged:$('mediaConfirm').checked,accept_static_fallback:$('fallback')?.checked||false,fallback_reason:$('fallbackReason')?.value||''});$('overrideApprove').onclick=()=>decision('override-approve',{override_id:$('override').value});
$('nextPending').onclick=()=>{const next=findNextPending();if(next)show(next.id)};
$('upload').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw Error('Choose a local media file');if(f.size>100*1024*1024)throw Error('Select an ability-length clip below 100 MiB');const bytes=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)});await act('media-import',{filename:f.name,bytes,role:$('mediaRole').value,variant:$('variant').checked,provenance:{origin:'local_upload',source:$('source').value,rights_holder:$('rights').value,license_reference:$('license').value,asset_version:$('version').value,distribution_status:'pending',display_role:$('display').value}})}catch(e){$('message').textContent=e.message}}}
let requestBusy=false;
async function post(body){body={request_id:crypto.randomUUID(),...body};if(requestBusy)throw Error('Another operation is running. Wait for it to finish.');requestBusy=true;const buttons=[...document.querySelectorAll('button')].map(b=>[b,b.disabled]);buttons.forEach(([b])=>b.disabled=true);try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);return data}finally{requestBusy=false;buttons.forEach(([b,disabled])=>b.disabled=disabled);if(typeof updateProposalButtons==='function')updateProposalButtons()}}
function requirement(message,ids=[]){$('message').className='requirement';$('message').setAttribute('role','alert');$('message').textContent='Cannot submit review: '+message;$('detail').querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));if(ids.includes('fallback')||ids.includes('fallbackReason'))$('mediaReviewDetails').open=true;for(const id of ids){const field=$(id);if(!field)continue;field.setAttribute('aria-invalid','true');field.closest('label')?.classList.add('invalid')}const first=ids.map(id=>$(id)).find(Boolean);(first||$('message')).scrollIntoView({block:'center',behavior:'smooth'});first?.focus()}
async function decision(action,extra){const reviewer=$('reviewer').value.trim(),notes=$('notes').value.trim(),ids=[];if(!reviewer)ids.push('reviewer');if(!reviewer)return requirement('enter your reviewer name.',ids);

if(action==='content'&&extra.status==='approved'){const missing=[['claims','claim check'],['cores','core-mechanic check'],['inference','inference acknowledgment'],['warnings','source-warning acknowledgment']].filter(([id])=>!$(id).checked);if(missing.length)return requirement('complete the '+missing.map(x=>x[1]).join(', ')+'.',missing.map(x=>x[0]));if(!extra.source_ids.length)return requirement('select at least one retrieved source excerpt.',[])}
if(action==='media'&&extra.status==='approved'){if(!extra.matching_checked)return requirement('confirm that you inspected the exact selected media and its source information.',['mediaConfirm']);if(current().media.fallback&&!extra.accept_static_fallback)return requirement('explicitly accept the matched static fallback.',['fallback']);}
await act(action,{...extra,reviewer,notes})}
async function combinedDecision(){const reviewer=$('reviewer').value.trim(),notes=$('notes').value.trim(),c=current();if(!reviewer)return requirement('enter your reviewer name.',['reviewer']);if(!$('combinedConfirm').checked)return requirement('confirm both the content review and media inspection.',['combinedConfirm']);const source_ids=[...document.querySelectorAll('[data-source]:checked')].map(e=>e.dataset.source);if(!source_ids.length)return requirement('select at least one retrieved source excerpt.');const fallback=Boolean(c.media.fallback);if(fallback&&!$('fallback')?.checked)return requirement('explicitly accept the matched static fallback.',['fallback']);await act('approve-content-and-media',{confirmation:true,source_ids,claims_checked:true,cores_checked:true,inferences_acknowledged:true,warnings_acknowledged:true,matching_checked:true,rights_acknowledged:true,accept_static_fallback:fallback?$('fallback').checked:false,fallback_reason:fallback?$('fallbackReason').value:''})}
function findNextPending(){const cards=state.cards.filter(x=>x.champion===current().champion);const index=cards.findIndex(x=>x.id===selected);const ordered=[...cards.slice(index+1),...cards.slice(0,index)];return ordered.find(x=>x.content_review.status==='pending'||x.media_review.status==='pending')}
async function act(action,extra){try{const c=current();saveCardForm(c.id);$('message').className='';$('message').setAttribute('role','status');$('detail').querySelectorAll('[aria-invalid="true"]').forEach(el=>el.removeAttribute('aria-invalid'));$('detail').querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));$('message').textContent='Saving review…';await post({action,id:c.id,expected:c.expected,reviewer:$('reviewer').value.trim(),notes:$('notes').value.trim(),...extra});await load(['content','media','approve-content-and-media'].includes(action));const approved=(action==='approve-content-and-media'||(action==='content'||action==='media')&&extra.status==='approved')&&current().content_review.status==='approved'&&current().media_review.status==='approved';$('message').textContent=action==='approve-content-and-media'?'Content and media approved. The reviews are saved separately.':'Review saved.';if(approved){const next=findNextPending();$('nextPending').hidden=!next;$('nextPending').textContent='Next pending card';$('nextPending').title=next?'Open '+next.working.row.champion+' · '+next.working.row.ability:'No other pending card';}}catch(e){$('message').className='requirement';$('message').setAttribute('role','alert');$('message').textContent='Review was not saved: '+(e.message==='Unknown editorial action'?'The review service is running older code. Restart the local editorial review service, then reload this page.':e.message);$('message').scrollIntoView({block:'center',behavior:'smooth'})}}
$('champion').onchange=renderList;load().catch(e=>$('message').textContent=e.message);
</script><script src="/editorial-export.js"></script></html>
